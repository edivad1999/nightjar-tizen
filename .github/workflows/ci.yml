name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: npm test
      - run: npm run build
      - name: The widget contains the wake module
        run: node scripts/check-wgt.mjs
