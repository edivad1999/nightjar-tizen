name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -c "import zipfile; z=zipfile.ZipFile('dist/nightjar.wgt'); names=z.namelist(); assert names[0]=='mimetype'; assert {'config.xml','index.html','app.js','ui.css','icon.png'} <= set(names)"
