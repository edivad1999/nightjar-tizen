name: Build and Release WGT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightjar-wgt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the widget build
        uses: ./.github/actions/setup-build

      - name: Next version from git tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main
          dry_run: true

      - name: Choose widget version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        run: |
          set -euo pipefail
          chosen="$(node scripts/widget-version.mjs resolve "${{ steps.tag.outputs.new_version }}" "${{ steps.tag.outputs.previous_version }}")"
          echo "value=${chosen}" >> "$GITHUB_OUTPUT"

      - name: Write version into config.xml
        if: steps.version.outputs.value
        run: node scripts/widget-version.mjs stamp "${{ steps.version.outputs.value }}"

      - name: Package unsigned WGT
        run: npm run build

      - name: Check the widget
        run: node scripts/check-wgt.mjs

      - name: Upload WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-wgt
          path: dist/nightjar.wgt
          retention-days: 30

      - name: Keep config.xml on main
        if: steps.version.outputs.value
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tizen/config.xml
          if git diff --cached --quiet; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): set widget version to ${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.value
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ steps.sync.outputs.sha }}
          name: v${{ steps.version.outputs.value }}
          body: |
            ## Nightjar v${{ steps.version.outputs.value }}

            Download `nightjar.wgt` and follow the README section "Install a release".

            Unsigned. Sign it locally: `tizen package -t wgt -s <your-profile> -- nightjar.wgt`

            ${{ steps.tag.outputs.changelog }}
          files: dist/nightjar.wgt
